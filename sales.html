<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AquaTrack — Water Factory Sales</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="logo">
          <span class="logo-icon">💧</span>
          <div class="logo-text">
            <span>AquaTrack</span>
            <span class="logo-tagline">Water Factory Ops</span>
          </div>
        </div>

        <nav>
          <a href="dashboard.html"> ▦ Dashboard </a>

          <a href="production.html"> ▣ Production </a>

          <a href="sales.html" class="active"> 🛒 Sales </a>

          <a href="expenses.html"> ▤ Expenses </a>
        </nav>

        <div class="user">
          <span>Bola Manager</span>
          👤
        </div>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="main">
        <section class="content">
          <!-- PAGE HEADER -->
          <div class="page-header">
            <h1>Sales</h1>

            <p>Track daily sales and payments</p>
          </div>

          <!-- PAGE GRID -->
          <div class="page-grid">
            <!-- SALES RECORDS -->
            <div>
              <div class="records">
                <!-- SALE 1 -->
                <div class="record">
                  <h3>Chidi Stores</h3>

                  <p>120 bags</p>

                  <strong> ₦42,000 </strong>

                  <br />

                  <span class="status"> Paid </span>
                </div>

                <!-- SALE 2 -->
                <div class="record">
                  <h3>Ngozi Water Depot</h3>

                  <p>80 bags</p>

                  <strong> ₦28,000 </strong>

                  <br />

                  <span class="status pending"> Pending </span>
                </div>

                <!-- SALE 3 -->
                <div class="record">
                  <h3>Eleha Stores</h3>

                  <p>50 bags</p>

                  <strong> ₦17,500 </strong>

                  <br />

                  <span class="status"> Paid </span>
                </div>
              </div>
            </div>

            <!-- RECORD SALES FORM -->
            <div class="form-card">
              <h2>Record Sales</h2>

              <p>Record a new sales transaction</p>

              <!-- DATE -->
              <div class="input-group">
                <label> Sale Date </label>

                <input type="date" value="2026-08-13" />
              </div>

              <!-- CUSTOMER -->
              <div class="input-group">
                <label> Customer / Buyer </label>

                <input type="text" placeholder="Enter customer name" />
              </div>

              <!-- QUANTITY -->
              <div class="input-group">
                <label> Number of Bags Sold </label>

                <input
                  type="number"
                  id="bagsSold"
                  placeholder="Enter number of bags"
                />
              </div>

              <!-- PRICE -->
              <div class="input-group">
                <label> Price Per Bag </label>

                <input type="number" id="pricePerBag" value="350" />
              </div>

              <!-- TOTAL -->
              <div class="input-group">
                <label> Total Sales </label>

                <input type="text" id="totalSales" placeholder="₦0" readonly />
              </div>

              <!-- PAYMENT -->
              <div class="input-group">
                <label> Payment Status </label>

                <select>
                  <option>Paid</option>

                  <option>Pending</option>
                </select>
              </div>

              <!-- BUTTONS -->
              <div class="form-buttons">
                <button type="button" class="secondary-btn">Cancel</button>

                <button type="button" id="saveSale" class="primary-btn">
                  Save Sale
                </button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
